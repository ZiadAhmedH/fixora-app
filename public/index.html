<!DOCTYPE html>
<html>
<head>

  <title>Fixora</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #0F1117;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;

    p { color: #A0A5B5; font-size: 15px; }

<body>
  <div class="card">
    <h1>Fixora</h1>
    <p>Please open this link on your mobile device with the Fixora app installed.</p>

</html>
